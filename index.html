<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest To-do</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">Quest To-do</h1>
    <button type="button" id="header-pet" class="header-pet" aria-label="펫 보기">
      <span id="header-pet-icon" aria-hidden="true"></span>
      <span id="header-pet-name" class="header-pet-name"></span>
      <span id="header-pet-mood" aria-hidden="true"></span>
    </button>
  </header>

  <nav class="tabs" role="tablist" aria-label="메뉴">
    <button type="button" class="tab is-active" role="tab" id="tab-todos"
            aria-controls="panel-todos" aria-selected="true" data-tab="todos">할 일</button>
    <button type="button" class="tab" role="tab" id="tab-pet"
            aria-controls="panel-pet" aria-selected="false" tabindex="-1" data-tab="pet">펫</button>
  </nav>

  <main class="panels">
    <section class="panel" role="tabpanel" id="panel-todos" aria-labelledby="tab-todos">
      <div class="date-bar">
        <button type="button" id="date-prev" class="btn btn-icon" aria-label="이전 날짜">◀</button>
        <strong id="date-label" class="date-label" aria-live="polite"></strong>
        <button type="button" id="date-next" class="btn btn-icon" aria-label="다음 날짜">▶</button>
        <button type="button" id="date-today" class="btn btn-small">오늘</button>
      </div>
      <p id="date-note" class="date-note" hidden>지난 날짜는 올클리어해도 펫이 자라지 않아요</p>

      <div class="progress-area">
        <div class="progress-info">
          <span id="progress-count"></span>
          <span id="progress-remaining" class="progress-remaining"></span>
        </div>
        <div id="progress-bar" class="progress" role="progressbar"
             aria-label="완료율" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <form id="todo-form" class="todo-form" autocomplete="off" novalidate>
        <input id="todo-title" class="todo-input" type="text" maxlength="50"
               placeholder="할 일을 입력하세요" aria-label="할 일 제목">
        <select id="todo-category" class="todo-select" aria-label="카테고리">
          <option value="work">업무</option>
          <option value="personal">개인</option>
          <option value="study">공부</option>
        </select>
        <button type="submit" class="btn btn-primary">추가</button>
      </form>
      <p id="todo-error" class="form-error" role="alert" hidden></p>

      <div id="category-filter" class="filter" role="group" aria-label="카테고리 필터">
        <button type="button" class="filter-btn is-active" data-filter="all" aria-pressed="true">전체</button>
        <button type="button" class="filter-btn" data-filter="work" aria-pressed="false">업무</button>
        <button type="button" class="filter-btn" data-filter="personal" aria-pressed="false">개인</button>
        <button type="button" class="filter-btn" data-filter="study" aria-pressed="false">공부</button>
      </div>

      <ul id="todo-list" class="todo-list"></ul>
      <p id="todo-empty" class="empty-message" hidden>오늘 할 일을 추가해 보세요</p>
    </section>

    <section class="panel" role="tabpanel" id="panel-pet" aria-labelledby="tab-pet" hidden>
      <div class="pet-card">
        <div id="pet-icon" class="pet-icon" aria-hidden="true"></div>
        <div class="pet-name-row">
          <strong id="pet-name" class="pet-name"></strong>
          <button type="button" id="pet-rename" class="btn btn-small">이름 바꾸기</button>
        </div>
        <p id="pet-stage" class="pet-stage"></p>
        <p id="pet-mood" class="pet-mood" aria-live="polite"></p>
        <div id="pet-progress" class="progress pet-progress" role="progressbar"
             aria-label="다음 단계까지" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="pet-progress-fill" class="progress-fill"></div>
        </div>
        <p id="pet-next" class="pet-next"></p>
      </div>
      <p class="panel-note">
        오늘 할 일을 3개 이상 모두 끝내면(올클리어) 펫이 하루에 한 번 자라요.
        지난 날짜는 올클리어해도 자라지 않아요.
      </p>
    </section>
  </main>

  <dialog id="pet-name-dialog" class="dialog" aria-labelledby="pet-name-title">
    <form id="pet-name-form" novalidate>
      <p class="dialog-icon" aria-hidden="true">🥚</p>
      <h2 id="pet-name-title" class="dialog-title">펫 이름을 지어 주세요</h2>
      <p class="dialog-note">할 일을 올클리어할 때마다 펫이 자라요. 이름은 나중에 바꿀 수 있어요.</p>
      <input id="pet-name-input" class="todo-input dialog-input" type="text"
             autocomplete="off" placeholder="예: 몽이" aria-label="펫 이름">
      <p id="pet-name-error" class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" id="pet-name-cancel" class="btn">취소</button>
        <button type="submit" class="btn btn-primary">확인</button>
      </div>
    </form>
  </dialog>

  <div id="toast-area" class="toast-area" aria-live="polite"></div>

  <div id="celebration" class="celebration" role="status" hidden>
    <div class="celebration-card">
      <span class="celebration-emoji" aria-hidden="true">🎉</span>
      <strong id="celebration-text" class="celebration-text"></strong>
    </div>
  </div>
</body>
</html>
