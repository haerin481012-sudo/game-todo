<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>퀘스트 투두</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">퀘스트 투두</h1>
    <div class="points" aria-live="polite">
      <span class="points-label">보유 포인트</span>
      <strong id="points-value" class="points-value">0</strong>
      <span class="points-unit">P</span>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="메뉴">
    <button type="button" class="tab is-active" role="tab" id="tab-todos"
            aria-controls="panel-todos" aria-selected="true" data-tab="todos">할 일</button>
    <button type="button" class="tab" role="tab" id="tab-shop"
            aria-controls="panel-shop" aria-selected="false" tabindex="-1" data-tab="shop">상점</button>
    <button type="button" class="tab" role="tab" id="tab-history"
            aria-controls="panel-history" aria-selected="false" tabindex="-1" data-tab="history">구매 내역</button>
  </nav>

  <main class="panels">
    <section class="panel" role="tabpanel" id="panel-todos" aria-labelledby="tab-todos">
      <div class="date-bar">
        <button type="button" id="date-prev" class="btn btn-icon" aria-label="이전 날짜">◀</button>
        <strong id="date-label" class="date-label" aria-live="polite"></strong>
        <button type="button" id="date-next" class="btn btn-icon" aria-label="다음 날짜">▶</button>
        <button type="button" id="date-today" class="btn btn-small">오늘</button>
      </div>
      <p id="date-note" class="date-note" hidden>지난 날짜에 새로 추가하는 할 일은 기록용이에요 (포인트 없음)</p>

      <div class="progress-area">
        <div class="progress-info">
          <span id="progress-count"></span>
          <span id="progress-remaining" class="progress-remaining"></span>
        </div>
        <div id="progress-bar" class="progress" role="progressbar"
             aria-label="완료율" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <form id="todo-form" class="todo-form" autocomplete="off" novalidate>
        <input id="todo-title" class="todo-input" type="text" maxlength="50"
               placeholder="할 일을 입력하세요" aria-label="할 일 제목">
        <select id="todo-category" class="todo-select" aria-label="카테고리">
          <option value="work">업무</option>
          <option value="personal">개인</option>
          <option value="study">공부</option>
        </select>
        <button type="submit" class="btn btn-primary">추가</button>
      </form>
      <p id="todo-error" class="form-error" role="alert" hidden></p>

      <div id="category-filter" class="filter" role="group" aria-label="카테고리 필터">
        <button type="button" class="filter-btn is-active" data-filter="all" aria-pressed="true">전체</button>
        <button type="button" class="filter-btn" data-filter="work" aria-pressed="false">업무</button>
        <button type="button" class="filter-btn" data-filter="personal" aria-pressed="false">개인</button>
        <button type="button" class="filter-btn" data-filter="study" aria-pressed="false">공부</button>
      </div>

      <ul id="todo-list" class="todo-list"></ul>
      <p id="todo-empty" class="empty-message" hidden>오늘 할 일을 추가해 보세요</p>
    </section>
    <section class="panel" role="tabpanel" id="panel-shop" aria-labelledby="tab-shop" hidden>
      <p class="panel-note">포인트로 가상 기프티콘을 교환해 보세요. 실제 결제는 없어요.</p>
      <div id="shop-grid" class="shop-grid"></div>
    </section>
    <section class="panel" role="tabpanel" id="panel-history" aria-labelledby="tab-history" hidden>
      <ul id="history-list" class="history-list"></ul>
      <p id="history-empty" class="empty-message" hidden>아직 구매한 기프티콘이 없어요. 상점에서 포인트를 써 보세요!</p>
    </section>
  </main>

  <dialog id="coupon-dialog" class="dialog" aria-labelledby="coupon-title">
    <p id="coupon-icon" class="dialog-icon"></p>
    <h2 id="coupon-title" class="dialog-title">구매 완료!</h2>
    <p id="coupon-item" class="dialog-item"></p>
    <p id="coupon-code" class="coupon-code"></p>
    <p class="dialog-note">쿠폰 번호는 구매 내역 탭에서 다시 볼 수 있어요.</p>
    <form method="dialog">
      <button type="submit" class="btn btn-primary">확인</button>
    </form>
  </dialog>

  <div id="toast-area" class="toast-area" aria-live="polite"></div>

  <div id="celebration" class="celebration" role="status" hidden>
    <div class="celebration-card">
      <span class="celebration-emoji" aria-hidden="true">🎉</span>
      <strong id="celebration-text" class="celebration-text"></strong>
    </div>
  </div>
</body>
</html>
